<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* CSS Code */
        .job-container {
        display: grid;
        /* Automatically fits columns based on minimum 300px width */
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px; /* Spacing between rows and columns */
        }

        .card {
        background: white;
        border: 1px solid #ddd;
        padding: 20px;
        border-radius: 8px;
        }

    </style>
</head>
<body>
    <div class="job-container">
        <div class="card">Job 1</div>
        <div class="card">Job 2</div>
        <div class="card">Job 3</div>
        <div class="card">Job 4</div>
        </div>
    
</body>
</html>
