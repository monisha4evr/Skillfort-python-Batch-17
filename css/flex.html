<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>day4</title>

  <style>
    .navbar {
      display: flex;
      justify-content: space-between; /* Pushes logo left, links right */
      align-items: center; /* Centers items vertically */
      padding: 15px;
      background-color: #f4f4f4;
    }

    .nav-links {
      display: flex;
      gap: 20px; /* Modern way to space out items */
      list-style: none;
    }

    .container div {
      background-color: #f1f1f1;
      width: 100px;
      margin: 10px;
      padding: 10px;
      text-align: center;  
      font-size: 30px;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">JobPortal</div>
    <ul class="nav-links">
      <li>Home</li>
      <li>Find Jobs</li>
      <li>Profile</li>
    </ul>
  </nav>
  
</body>
</html>
