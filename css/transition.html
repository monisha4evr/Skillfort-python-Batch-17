<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            background-color: aqua;
            transition: width 4s ease,height 4s, background-color 5s;
            transition-delay: 1s;
        }
        div:hover{
            width: 400px;
            height : 400px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <h2> Transition Example</h2>
    <div></div>
</body>
</html>
