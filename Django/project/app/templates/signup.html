<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register User</title>
    <style>
        
    </style>
</head>
<body>
    <div id="container">
        <h1>User Registration</h1>
        <form action="" method="post">
            {% csrf_token %}
            <input type="text" placeholder="Username" name="username" id="username"><br><br>
            <input type="text" placeholder="Email" name="email" id="email"><br><br>
            <input type="text" placeholder="password" name="password" id="password"><br><br>
            <input type="text" placeholder="ConfirmPassword" name="confirm_password" id="confirm_password"><br><br>
            <button type="submit">Register</button>
            <a href="{% url 'userSigin' %}"> Already Registered </a>
        </form>
    </div>

</body>
</html>
