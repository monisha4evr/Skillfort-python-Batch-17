<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products List</title>
</head>
<body>
    <table>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Description</th>
            <th>Rating</th>
            <th>Action</th>
        </tr>
   
    {% for i in product %}
    <tr>
       <td> {{i.product_name}}</td>
       <td>{{i.price}}</td>
        <td>{{i.description}}</td>
        <td>{{i.rating}}</td>
        <td><a href="{% url 'product_details' i.id %} ">View</a></td>

    </tr>
    {%endfor%}
     </table>
</body>
</html>
